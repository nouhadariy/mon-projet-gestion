<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Stagiaires</title>
  <style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Poppins", sans-serif;
  background:
  linear-gradient(135deg,#3b0719,#5c102c,#7b1e46);
  min-height:100vh;
  color:white;
}

/* NAVBAR */

.navbar{
  width:100%;
  padding:18px 35px;
  display:flex;
  justify-content:center;
  gap:35px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  box-shadow:0 4px 25px rgba(0,0,0,0.25);
}

.navbar a{
  color:white;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  position:relative;
  transition:0.3s;
}

.navbar a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:0%;
  height:2px;
  background:#ffb3c7;
  transition:0.4s;
}

.navbar a:hover::after{
  width:100%;
}

.navbar a:hover{
  color:#ffdce5;
}

/* CONTAINER */

.container{
  width:92%;
  max-width:1200px;
  margin:40px auto;
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:35px;
  color:#fff0f5;
  text-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* FORMULAIRE */

.formulaire,
.tableau-section{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(15px);
  border-radius:25px;
  padding:30px;
  margin-bottom:35px;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.formulaire h2,
.tableau-section h2{
  margin-bottom:25px;
  color:#ffe4ec;
  font-size:24px;
}

/* INPUTS */

.ligne{
  display:flex;
  gap:20px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.ligne div{
  flex:1;
  min-width:240px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:600;
  color:#ffe8ef;
}

input,
select{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:rgba(255,255,255,0.12);
  color:white;
  font-size:14px;
  outline:none;
  transition:0.3s;
}

input::placeholder{
  color:#f5c8d5;
}

option{
  color:black;
}

input:focus,
select:focus{
  background:rgba(255,255,255,0.18);
  border:1px solid #ffb3c7;
  transform:scale(1.01);
}

/* BUTTON */

button{
  background:linear-gradient(135deg,#a61d4d,#d6336c);
  border:none;
  padding:13px 24px;
  border-radius:14px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  margin-top:10px;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.btn-annuler{
  background:linear-gradient(135deg,#777,#999);
}

/* ERREUR */

#erreur{
  display:none;
  background:rgba(255,0,0,0.15);
  border:1px solid #ff8fa3;
  color:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:18px;
}

/* TABLEAU */

table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:18px;
}

th{
  background:#8b1e46;
  padding:16px;
  text-align:left;
  color:white;
  font-size:14px;
}

td{
  padding:15px;
  background:rgba(255,255,255,0.05);
  border-bottom:1px solid rgba(255,255,255,0.08);
  color:#fff5f7;
}

tr:hover td{
  background:rgba(255,255,255,0.1);
  transition:0.3s;
}

/* MODAL */

#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  z-index:999;
}

.modal-boite{
  width:420px;
  max-width:90%;
  margin:90px auto;
  padding:30px;
  border-radius:24px;
  background:linear-gradient(135deg,#5c102c,#7b1e46);
  box-shadow:0 10px 35px rgba(0,0,0,0.4);
}

.modal-boite h2{
  margin-bottom:10px;
  color:#fff0f5;
}

.sous-titre{
  color:#ffd7e1;
  margin-bottom:20px;
  font-size:14px;
}

</style>
</head>
<body>

  <div class="navbar">
    <a href="/">Accueil</a>
    <a href="/stagiaires.html">Stagiaires</a>
    <a href="/formateurs.html">Formateurs</a>
  </div>

  <div class="container">
    <h1>Gestion des Stagiaires</h1>

    <!-- Formulaire ajout -->
    <div class="formulaire">
      <h2>Ajouter un stagiaire</h2>
      <div id="erreur"></div>

      <div class="ligne">
        <div>
          <label>Nom :</label>
          <input type="text" id="nom" placeholder="EDDARIY">
        </div>
        <div>
          <label>Prenom :</label>
          <input type="text" id="prenom" placeholder="nouhaila">
        </div>
      </div>

      <div class="ligne">
        <div>
          <label>Age :</label>
          <input type="number" id="age" placeholder="24" min="16" max="60">
        </div>
        <div>
          <label>N° Inscription :</label>
          <input type="text" id="nInscription" placeholder="INS-2024-001">
        </div>
      </div>

      <div class="ligne">
        <div>
          <label>Filiere :</label>
          <select id="filiere">
            <option value="">-- Choisir --</option>
            <option>Developpement Web</option>
            <option>Reseaux Informatiques</option>
            <option>Developpement Mobile</option>
            <option>Cybersecurite</option>
            <option>Intelligence Artificielle</option>
          </select>
        </div>
        <div>
          <label>Groupe :</label>
          <select id="groupe">
            <option value="">-- Choisir --</option>
            <option>G1</option>
            <option>G2</option>
            <option>G3</option>
            <option>G4</option>
          </select>
        </div>
      </div>

      <button onclick="ajouter()">Ajouter</button>
    </div>

    <!-- Tableau -->
    <div class="tableau-section">
      <h2>Liste des stagiaires</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Nom Prenom</th><th>Age</th>
            <th>N° Inscription</th><th>Filiere</th><th>Groupe</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" style="text-align:center;color:gray;">Chargement...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal modification -->
  <div id="modal">
    <div class="modal-boite">
      <h2>Modifier le stagiaire</h2>
      <div class="sous-titre" id="editNom"></div>
      <input type="hidden" id="editId">

      <label>Filiere :</label>
      <select id="editFiliere">
        <option>Developpement Web</option>
        <option>Reseaux Informatiques</option>
        <option>Developpement Mobile</option>
        <option>Cybersecurite</option>
        <option>Intelligence Artificielle</option>
      </select>

      <label>Groupe :</label>
      <select id="editGroupe">
        <option>G1</option><option>G2</option><option>G3</option><option>G4</option>
      </select>

      <br>
      <button onclick="sauvegarder()">Sauvegarder</button>
      <button class="btn-annuler" onclick="fermerModal()">Annuler</button>
    </div>
  </div>

  <script>
    class Personne {
      constructor(nom, prenom, age) {
        this.nom = nom; this.prenom = prenom; this.age = age;
      }
    }
    class Stagiaire extends Personne {
      constructor(nom, prenom, age, nInscription, filiere, groupe) {
        super(nom, prenom, age);
        this.nInscription = nInscription;
        this.filiere = filiere;
        this.groupe  = groupe;
      }
    }
  </script>
  <script src="/stagiaire.js"></script>

</body>
</html>
