<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accueil</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      font-family: "Segoe UI", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #3b0a1e, #5e1735, #7a1f45);
      color: white;
    }

    /* NAVBAR */
    .navbar{
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: center;
      gap: 30px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .navbar a{
      text-decoration: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      transition: 0.3s;
      position: relative;
    }

    .navbar a::after{
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      left: 0;
      bottom: -5px;
      background: #ffb3c6;
      transition: 0.3s;
    }

    .navbar a:hover::after{
      width: 100%;
    }

    .navbar a:hover{
      color: #ffd6e0;
    }

    /* CONTAINER */
    .container{
      width: 90%;
      max-width: 1000px;
      margin: 80px auto;
      text-align: center;
    }

    h1{
      font-size: 45px;
      margin-bottom: 15px;
      color: #fff0f5;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    p{
      font-size: 18px;
      color: #f8d7df;
      margin-bottom: 50px;
    }

    /* CARDS */
    .cartes{
      display: flex;
      justify-content: center;
      gap: 35px;
      flex-wrap: wrap;
    }

    .carte{
      width: 280px;
      padding: 35px 25px;
      border-radius: 20px;
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      transition: 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .carte::before{
      content: "";
      position: absolute;
      width: 150%;
      height: 150%;
      background: rgba(255,255,255,0.08);
      transform: rotate(45deg);
      top: -120%;
      left: -120%;
      transition: 0.6s;
    }

    .carte:hover::before{
      top: -20%;
      left: -20%;
    }

    .carte:hover{
      transform: translateY(-10px) scale(1.03);
      background: rgba(255,255,255,0.15);
      border-color: #ffb3c6;
    }

    .carte span{
      display: block;
      font-size: 55px;
      margin-bottom: 15px;
    }

    .carte strong{
      display: block;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .carte small{
      font-size: 14px;
      color: #f3d6df;
    }

  </style>
</head>

<body>

  <div class="navbar">
    <a href="/">Accueil</a>
    <a href="/stagiaires.html">Stagiaires</a>
    <a href="/formateurs.html">Formateurs</a>
  </div>

  <div class="container">
    <h1>Gestion Centre de Formation</h1>
    <p>Choisissez une section :</p>

    <div class="cartes">

      <a href="/stagiaires.html" class="carte">
        <span>🎒</span>
        <strong>Stagiaires</strong>
        <small>Ajouter, modifier et supprimer</small>
      </a>

      <a href="/formateurs.html" class="carte">
        <span>👨‍🏫</span>
        <strong>Formateurs</strong>
        <small>Ajouter, modifier et supprimer</small>
      </a>

    </div>
  </div>

</body>
</html>
